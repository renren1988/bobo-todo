services:
  bobo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      BOBO_PUSH_CONTACT: mailto:${CONTACT_EMAIL:?Set CONTACT_EMAIL}
      BOBO_SMTP_HOST: ${BOBO_SMTP_HOST:-}
      BOBO_SMTP_PORT: ${BOBO_SMTP_PORT:-465}
      BOBO_SMTP_USER: ${BOBO_SMTP_USER:-}
      BOBO_SMTP_PASSWORD: ${BOBO_SMTP_PASSWORD:-}
      BOBO_MAIL_FROM: ${BOBO_MAIL_FROM:-}
    volumes:
      - ./state/bobo:/app/.runtime/server
    expose:
      - "8787"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bobo
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOBO_DOMAIN: ${BOBO_DOMAIN:?Set BOBO_DOMAIN}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?Set CONTACT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/caddy-data:/data
      - ./state/caddy-config:/config
