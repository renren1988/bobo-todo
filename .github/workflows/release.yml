name: Publish version notes
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate version and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
          python3 scripts/release-notes.py "$RELEASE_TAG" --output .runtime/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=false --title "啵啵待办 $RELEASE_TAG" --notes-file .runtime/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "啵啵待办 $RELEASE_TAG" --notes-file .runtime/release-notes.md
          fi
